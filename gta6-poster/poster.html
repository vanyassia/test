<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>GTA VI Release Day</title>
<style>
  :root{
    --night:#140a2e; --violet:#3b1a6b; --magenta:#d6337f; --coral:#ff6b5a;
    --amber:#ffb347; --cream:#fff1d6; --teal:#2ee6d6; --ink:#0b0618;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1000px;height:1500px;background:var(--ink)}
  .poster{position:relative;width:1000px;height:1500px;overflow:hidden;
    font-family:"Inter Display","Inter",sans-serif;color:var(--cream);
    background:linear-gradient(180deg,#0e0726 0%,#2a1160 22%,#6a1f7a 40%,#c22f7c 54%,#ff5f5a 63%,#ffa24a 68%,#ffcf6e 70.5%);}
  svg.scene{position:absolute;inset:0;width:100%;height:100%}

  .top{position:absolute;top:56px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-family:"JetBrains Mono",monospace;font-size:19px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
  .top .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--teal);
    box-shadow:0 0 14px var(--teal);margin-right:12px;vertical-align:1px}
  .rule{position:absolute;top:96px;left:64px;right:64px;height:2px;background:rgba(255,241,214,.55)}

  .kicker{position:absolute;top:138px;left:0;right:0;text-align:center;font-weight:800;
    font-size:34px;letter-spacing:.42em;padding-left:.42em;color:var(--cream)}
  .title{position:absolute;top:204px;left:0;right:0;text-align:center;line-height:.8}
  .gta{display:block;font-weight:900;font-size:200px;letter-spacing:.06em;padding-left:.06em;
    color:var(--cream);text-shadow:0 6px 0 rgba(20,10,46,.35)}
  .vi{display:block;font-weight:900;font-size:520px;letter-spacing:-.02em;margin-top:-6px;
    background:linear-gradient(180deg,#fff6e0 0%,#ffd27a 34%,#ff7a59 62%,#e23a86 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 18px 30px rgba(30,6,60,.55))}

  .bottom{position:absolute;left:64px;right:64px;bottom:60px}
  .date{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
  .date .big{font-weight:900;font-size:132px;line-height:.82;letter-spacing:-.02em;color:var(--cream)}
  .date .big small{display:block;font-size:30px;font-weight:700;letter-spacing:.32em;margin-bottom:14px;color:var(--teal)}
  .date .side{text-align:right;font-weight:700;font-size:26px;line-height:1.35;letter-spacing:.04em}
  .date .side b{display:block;font-weight:900;font-size:36px;letter-spacing:.02em}
  .meta{margin-top:30px;padding-top:18px;border-top:2px solid rgba(255,241,214,.55);display:flex;justify-content:space-between;
    font-family:"JetBrains Mono",monospace;font-size:16px;letter-spacing:.18em;text-transform:uppercase;opacity:.85}
  .grain{position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.32}
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 80% 70% at 50% 45%,transparent 55%,rgba(8,3,20,.55) 100%)}
</style>
</head>
<body>
<div class="poster">
  <svg class="scene" viewBox="0 0 1000 1500" preserveAspectRatio="none" id="scene">
    <defs>
      <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#ffb347"/><stop offset="1" stop-color="#ff4f7b"/>
      </linearGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#6b2a8a"/><stop offset=".35" stop-color="#2c1561"/><stop offset="1" stop-color="#0b0618"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#ffb36b" stop-opacity=".75"/><stop offset="1" stop-color="#ff5f7a" stop-opacity="0"/>
      </radialGradient>
      <clipPath id="sunclip"><rect x="0" y="0" width="1000" height="1058"/></clipPath>
      <mask id="sunstripes"><rect width="1000" height="1500" fill="#fff"/><g id="stripes" fill="#000"></g></mask>
    </defs>
    <!-- stars -->
    <g id="stars" fill="#fff1d6"></g>
    <!-- sun glow + sun -->
    <circle cx="500" cy="1000" r="430" fill="url(#glow)"/>
    <g clip-path="url(#sunclip)"><circle cx="500" cy="1000" r="250" fill="url(#sun)" mask="url(#sunstripes)"/></g>
    <!-- distant skyline -->
    <g id="skyline" fill="#3a1650" opacity=".92"></g>
    <!-- sea -->
    <rect x="0" y="1058" width="1000" height="442" fill="url(#sea)"/>
    <g id="reflect"></g>
    <g id="waves" stroke="#2ee6d6" stroke-opacity=".22" stroke-width="2" fill="none"></g>
    <!-- palms -->
    <g id="palms" fill="#12071f"></g>
  </svg>

  <div class="top"><span><span class="dot"></span>Леонида, США</span><span>Фан-постер</span></div>
  <div class="rule"></div>

  <div class="kicker">ДЕНЬ ВЫХОДА</div>
  <div class="title">
    <span class="gta">GTA</span>
    <span class="vi">VI</span>
  </div>

  <div class="bottom">
    <div class="date">
      <div class="big"><small>ЧЕТВЕРГ</small>19.11.26</div>
      <div class="side"><b>Добро пожаловать<br>в Леониду</b>PS5 · Xbox Series X|S</div>
    </div>
    <div class="meta"><span>Vice City — Grassrivers — Port Gellhorn</span><span>2026</span></div>
  </div>

  <svg class="grain" viewBox="0 0 1000 1500" preserveAspectRatio="none">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  <div class="vignette"></div>
</div>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e;};
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

// stars (upper sky only)
const stars=document.getElementById('stars');
for(let i=0;i<90;i++){const y=rnd()*520;el('circle',{cx:rnd()*1000,cy:y,r:(rnd()*1.6+.4).toFixed(2),opacity:(0.25+rnd()*0.6*(1-y/600)).toFixed(2)},stars);}

// sun stripes (retro cuts, thicker toward horizon)
const stripes=document.getElementById('stripes');
let y=930,h=4;while(y<1060){el('rect',{x:0,y:y,width:1000,height:h},stripes);y+=h+14-h*0.5;h+=2.6;}

// skyline silhouette on horizon
const sky=document.getElementById('skyline');
let x=150;while(x<850){const w=14+rnd()*26,hh=10+rnd()*(x>380&&x<620?70:38);el('rect',{x:x,y:1058-hh,width:w,height:hh},sky);x+=w+rnd()*6;}
el('rect',{x:470,y:938,width:18,height:120},sky); // tall tower
el('rect',{x:478,y:905,width:2,height:34},sky);

// sun reflection on water
const ref=document.getElementById('reflect');
for(let i=0;i<16;i++){const yy=1068+i*i*1.45+i*6;const w=300-i*15+rnd()*30;
  el('rect',{x:500-w/2+(rnd()-.5)*20,y:yy,width:w,height:Math.max(2,6-i*.3),rx:3,fill:i<6?'#ffb347':'#ff4f7b',opacity:(0.85-i*0.05).toFixed(2)},ref);}
const waves=document.getElementById('waves');
for(let i=0;i<9;i++){const yy=1120+i*i*4.4+i*14;let d=`M0 ${yy}`;for(let xx=0;xx<=1000;xx+=50)d+=` Q ${xx+25} ${yy+(i%2?4:-4)} ${xx+50} ${yy}`;el('path',{d},waves);}

// palms
const palms=document.getElementById('palms');
function palm(bx,by,tx,ty,bend,scale){
  const g=el('g',{},palms);
  // tapered trunk as filled polygon along a quadratic curve
  const cx=(bx+tx)/2+bend, cy=(by+ty)/2;
  const N=40, L=[], R=[];
  for(let i=0;i<=N;i++){const t=i/N;
    const px=(1-t)*(1-t)*bx+2*(1-t)*t*cx+t*t*tx, py=(1-t)*(1-t)*by+2*(1-t)*t*cy+t*t*ty;
    const dx=2*(1-t)*(cx-bx)+2*t*(tx-cx), dy=2*(1-t)*(cy-by)+2*t*(ty-cy), len=Math.hypot(dx,dy);
    const w=(22-14*t)*scale + (i%4===0?2.5*scale:0); // rings
    L.push([px-dy/len*w/2,py+dx/len*w/2]);R.push([px+dy/len*w/2,py-dx/len*w/2]);}
  el('path',{d:'M'+L.map(p=>p.join(' ')).join(' L')+' L'+R.reverse().map(p=>p.join(' ')).join(' L')+'Z'},g);
  // fronds
  const angles=[-168,-140,-112,-80,-52,-22,4,-196,-220];
  angles.forEach((a,k)=>{
    const len=(150+rnd()*60)*scale, droop=(50+rnd()*40)*scale, th=(12+rnd()*4)*scale;
    const f=el('g',{transform:`translate(${tx} ${ty}) rotate(${a})`},g);
    // leaf blade with drooping curve
    el('path',{d:`M0 0 Q ${len*.45} ${-th} ${len} ${droop} Q ${len*.5} ${th*.35} 0 0 Z`},f);
    // hanging leaflets on both sides of the rib
    for(let s=1;s<15;s++){const t=s/15;const px=len*t, py=droop*t*t*0.9-th*.5*(1-t)*t*2;
      const ll=(46-24*t)*scale, sw=(5.5-2.5*t)*scale;
      el('path',{d:`M${px} ${py} q ${ll*.2} ${ll*.4} ${ll*.55} ${ll*.95}`,fill:'none',stroke:'#12071f','stroke-width':sw,'stroke-linecap':'round'},f);
      el('path',{d:`M${px} ${py} q ${ll*.35} ${-ll*.2} ${ll*.75} ${ll*.25}`,fill:'none',stroke:'#12071f','stroke-width':sw,'stroke-linecap':'round'},f);}
  });
  // coconuts
  [[-8,8],[6,12],[-2,16]].forEach(([dx,dy])=>el('circle',{cx:tx+dx*scale,cy:ty+dy*scale,r:7*scale},g));
}
palm(-20,1520,120,860,120,1.25);
palm(60,1520,40,1040,-70,0.9);
palm(1030,1520,880,800,-140,1.35);
palm(950,1520,975,1080,60,0.8);
</script>
</body>
</html>
