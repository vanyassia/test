<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Превью для YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --panel: #171722;
    --line: #2a2a3a;
    --text: #ececf4;
    --muted: #9a9ab0;
    --accent: #ffd400;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font: 800 22px "Unbounded", sans-serif; margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 20px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .stage {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px;
  }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; aspect-ratio: 16 / 9; }
  .small-preview { display: flex; gap: 14px; align-items: center; margin-top: 12px; color: var(--muted); font-size: 13px; }
  .small-preview canvas { width: 210px; border-radius: 6px; flex: none; }
  .controls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
  input[type=text], textarea, select {
    width: 100%; background: #0f0f18; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 84px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  }
  .swatch[aria-pressed=true] { border-color: #fff; }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .seg button, .btn {
    background: #0f0f18; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); color: #111; border: none; font-weight: 700; font-size: 15px; padding: 12px; }
  .hint { font-size: 12px; color: var(--muted); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button { background: none; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  .presets button:hover { color: var(--text); border-color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Превью для YouTube</h1>
  <p class="sub">1280×720. Меняй тексты справа и скачивай PNG.</p>

  <div class="layout">
    <div class="stage">
      <canvas id="c" width="1280" height="720"></canvas>
      <div class="small-preview">
        <canvas id="mini" width="420" height="236"></canvas>
        <span>Так превью выглядит в ленте. Заголовок должен читаться даже здесь.</span>
      </div>
    </div>

    <div class="controls">
      <div>
        <div class="hint" style="margin-bottom:6px">Готовые варианты</div>
        <div class="presets" id="presets"></div>
      </div>
      <label>Заголовок (каждая строка отдельно, *слово* подсветится)
        <textarea id="title"></textarea>
      </label>
      <label>Наклейка
        <input type="text" id="sticker">
      </label>
      <label>Название канала
        <input type="text" id="channel">
      </label>
      <div>
        <div class="hint" style="margin-bottom:6px">Картинка справа</div>
        <div class="seg" id="visual">
          <button data-v="code">Код</button>
          <button data-v="game">Игра</button>
          <button data-v="chat">ИИ-чат</button>
          <button data-v="photo">Своё фото</button>
        </div>
      </div>
      <label id="photoWrap" hidden>Фото (лучше вырезанное, PNG без фона)
        <input type="file" id="photo" accept="image/*">
      </label>
      <div>
        <div class="hint" style="margin-bottom:6px">Акцент</div>
        <div class="row" id="colors"></div>
      </div>
      <button class="btn primary" id="dl">Скачать PNG</button>
    </div>
  </div>
</div>

<script>
const W = 1280, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const mini = document.getElementById('mini');
const mctx = mini.getContext('2d');

const ACCENTS = [
  { a: '#ffd400', b: '#7b2ff7', c: '#0b0620' },
  { a: '#39ff88', b: '#0066ff', c: '#020b18' },
  { a: '#ff3d6e', b: '#ff9a00', c: '#1a0508' },
  { a: '#00e5ff', b: '#e100ff', c: '#0a0418' },
];

const PRESETS = [
  { name: 'Сайт с ИИ', title: 'СДЕЛАЛ *САЙТ*\nС ПОМОЩЬЮ ИИ', sticker: 'ЗА 10 МИНУТ', visual: 'code', accent: 0 },
  { name: 'Игра', title: 'НАПИСАЛ\n*ИГРУ*\nБЕЗ КОДА', sticker: 'ОДИН ФАЙЛ', visual: 'game', accent: 1 },
  { name: 'Свой чат-бот', title: 'СВОЙ *ЧАТ-БОТ*\nБЕСПЛАТНО', sticker: 'БЕЗ ИНТЕРНЕТА', visual: 'chat', accent: 3 },
  { name: 'ИИ vs я', title: '*ИИ* ПРОТИВ\nПРОГРАММИСТА', sticker: 'КТО КРУЧЕ?', visual: 'code', accent: 2 },
];

const state = {
  title: PRESETS[0].title,
  sticker: PRESETS[0].sticker,
  channel: 'VANYASSIA',
  visual: 'code',
  accent: 0,
  photo: null,
};

/* ---------- helpers ---------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rand(seed) {
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

/* ---------- background ---------- */
function drawBackground(p) {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, p.c);
  g.addColorStop(1, '#000');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // big glow behind the visual
  const rg = ctx.createRadialGradient(930, 360, 20, 930, 360, 560);
  rg.addColorStop(0, p.b + 'cc');
  rg.addColorStop(0.45, p.b + '44');
  rg.addColorStop(1, p.b + '00');
  ctx.fillStyle = rg;
  ctx.fillRect(0, 0, W, H);

  // perspective grid floor
  ctx.save();
  ctx.strokeStyle = p.b + '55';
  ctx.lineWidth = 1.5;
  const horizon = 470, vx = 900;
  for (let i = -14; i <= 14; i++) {
    ctx.beginPath();
    ctx.moveTo(vx, horizon);
    ctx.lineTo(vx + i * 140, H);
    ctx.stroke();
  }
  for (let k = 0; k < 9; k++) {
    const y = horizon + Math.pow(k / 8, 2.2) * (H - horizon);
    ctx.globalAlpha = 0.25 + k * 0.08;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  // fade grid under the text side
  const lg = ctx.createLinearGradient(0, 0, 760, 0);
  lg.addColorStop(0, 'rgba(0,0,0,0.85)');
  lg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, 760, H);

  // sparkles
  const r = rand(7);
  for (let i = 0; i < 70; i++) {
    const x = r() * W, y = r() * 460, s = r() * 2 + 0.5;
    ctx.fillStyle = `rgba(255,255,255,${0.2 + r() * 0.5})`;
    ctx.fillRect(x, y, s, s);
  }
}

/* ---------- right-side visuals ---------- */
function windowFrame(p, x, y, w, h, label) {
  ctx.save();
  ctx.shadowColor = p.b;
  ctx.shadowBlur = 60;
  rr(x, y, w, h, 22);
  ctx.fillStyle = '#12121c';
  ctx.fill();
  ctx.restore();
  rr(x, y, w, h, 22);
  ctx.lineWidth = 4;
  ctx.strokeStyle = 'rgba(255,255,255,0.18)';
  ctx.stroke();
  // title bar
  ctx.save();
  rr(x, y, w, 56, 22);
  ctx.clip();
  ctx.fillStyle = '#1d1d2b';
  ctx.fillRect(x, y, w, 56);
  ctx.restore();
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => {
    ctx.beginPath();
    ctx.arc(x + 32 + i * 28, y + 28, 9, 0, Math.PI * 2);
    ctx.fillStyle = c;
    ctx.fill();
  });
  ctx.fillStyle = '#8a8aa3';
  ctx.font = '600 20px "JetBrains Mono", monospace';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 130, y + 35);
}

function drawCode(p) {
  ctx.save();
  ctx.translate(930, 350);
  ctx.rotate(0.07);
  const w = 520, h = 400, x = -w / 2, y = -h / 2;
  windowFrame(p, x, y, w, h, 'index.html');

  const lines = [
    [['#c678dd', '<!DOCTYPE'], ['#e5c07b', ' html'], ['#c678dd', '>']],
    [['#e06c75', '<canvas'], ['#d19a66', ' id'], ['#98c379', '="game"'], ['#e06c75', '>']],
    [['#e06c75', '<script>']],
    [['#c678dd', '  const '], ['#61afef', 'ai'], ['#abb2bf', ' = '], ['#98c379', '"magic"'], ['#abb2bf', ';']],
    [['#61afef', '  build'], ['#abb2bf', '('], ['#e5c07b', 'site'], ['#abb2bf', ');']],
    [['#61afef', '  launch'], ['#abb2bf', '('], ['#d19a66', 'now'], ['#abb2bf', ');']],
    [['#e06c75', '<\/script>']],
  ];
  ctx.font = '700 25px "JetBrains Mono", monospace';
  lines.forEach((ln, i) => {
    let cx = x + 34;
    const cy = y + 106 + i * 42;
    ctx.fillStyle = '#4b4b63';
    ctx.fillText(String(i + 1), cx, cy);
    cx += 42;
    ln.forEach(([col, t]) => {
      ctx.fillStyle = col;
      ctx.fillText(t, cx, cy);
      cx += ctx.measureText(t).width;
    });
  });
  // cursor
  ctx.fillStyle = p.a;
  ctx.fillRect(x + 76, y + 106 + 7 * 42 - 24, 14, 30);
  ctx.restore();

  // floating "</>" badge
  ctx.save();
  ctx.translate(1150, 170);
  ctx.rotate(-0.12);
  ctx.shadowColor = p.a;
  ctx.shadowBlur = 40;
  rr(-80, -60, 160, 120, 28);
  ctx.fillStyle = p.a;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#111';
  ctx.font = '900 58px "JetBrains Mono", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('</>', 0, 4);
  ctx.restore();
}

function drawGame(p) {
  ctx.save();
  ctx.translate(930, 370);
  ctx.rotate(-0.06);
  const n = 6, s = 74, g = 8;
  const size = n * s + (n - 1) * g;
  const x0 = -size / 2, y0 = -size / 2;
  ctx.shadowColor = p.b;
  ctx.shadowBlur = 70;
  rr(x0 - 24, y0 - 24, size + 48, size + 48, 28);
  ctx.fillStyle = '#12121c';
  ctx.fill();
  ctx.shadowBlur = 0;
  const open = {
    '0,0': 1, '1,0': 1, '2,0': 2, '0,1': 1, '1,1': '', '2,1': 3, '0,2': 2, '1,2': 4,
    '3,3': 1, '4,3': 2, '3,4': 1, '4,4': '', '5,4': 1, '3,5': 2, '4,5': 1, '5,5': '',
  };
  const numColor = { 1: '#4da3ff', 2: '#39ff88', 3: '#ff3d6e', 4: '#c678dd' };
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const x = x0 + i * (s + g), y = y0 + j * (s + g);
    const k = i + ',' + j;
    rr(x, y, s, s, 12);
    if (k in open) {
      ctx.fillStyle = '#20202f';
      ctx.fill();
      if (open[k] !== '') {
        ctx.fillStyle = numColor[open[k]];
        ctx.font = '900 40px "Unbounded", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(open[k], x + s / 2, y + s / 2 + 2);
      }
    } else {
      const tg = ctx.createLinearGradient(x, y, x, y + s);
      tg.addColorStop(0, '#4a4a66');
      tg.addColorStop(1, '#2e2e44');
      ctx.fillStyle = tg;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(255,255,255,0.12)';
      ctx.stroke();
    }
    // flags
    if (k === '3,1' || k === '2,3') {
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 30, y + 18, 5, 40);
      ctx.beginPath();
      ctx.moveTo(x + 35, y + 18);
      ctx.lineTo(x + 58, y + 28);
      ctx.lineTo(x + 35, y + 38);
      ctx.closePath();
      ctx.fillStyle = '#ff3d6e';
      ctx.fill();
    }
  }
  ctx.restore();

  // big bomb accent
  ctx.save();
  ctx.translate(1160, 160);
  ctx.shadowColor = p.a;
  ctx.shadowBlur = 50;
  ctx.beginPath();
  ctx.arc(0, 0, 56, 0, Math.PI * 2);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 6;
  ctx.strokeStyle = p.a;
  ctx.stroke();
  for (let a = 0; a < 8; a++) {
    ctx.save();
    ctx.rotate(a * Math.PI / 4);
    ctx.fillStyle = '#111';
    ctx.fillRect(-7, -78, 14, 26);
    ctx.restore();
  }
  ctx.beginPath();
  ctx.arc(-18, -18, 13, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.fill();
  ctx.restore();
}

function drawChat(p) {
  ctx.save();
  ctx.translate(930, 360);
  ctx.rotate(0.05);
  const w = 500, h = 440, x = -w / 2, y = -h / 2;
  windowFrame(p, x, y, w, h, 'chat.html');
  const bubbles = [
    { me: true, t: 'Сделай мне игру', w: 280 },
    { me: false, t: 'Готово! Запускай →', w: 320 },
    { me: true, t: 'А сайт?', w: 170 },
    { me: false, t: 'Уже пишу код...', w: 270 },
  ];
  ctx.font = '600 24px "Unbounded", sans-serif';
  bubbles.forEach((b, i) => {
    const by = y + 90 + i * 84;
    b.w = ctx.measureText(b.t).width + 44;
    const bx = b.me ? x + w - 30 - b.w : x + 30;
    rr(bx, by, b.w, 60, 22);
    ctx.fillStyle = b.me ? p.a : '#262638';
    ctx.fill();
    ctx.fillStyle = b.me ? '#111' : '#ececf4';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.t, bx + 22, by + 31);
  });
  ctx.restore();

  // robot head
  ctx.save();
  ctx.translate(1160, 160);
  ctx.rotate(0.1);
  ctx.shadowColor = p.a;
  ctx.shadowBlur = 45;
  rr(-70, -56, 140, 112, 30);
  ctx.fillStyle = p.a;
  ctx.fill();
  ctx.shadowBlur = 0;
  rr(-52, -34, 104, 60, 18);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.fillStyle = p.a;
  ctx.beginPath(); ctx.arc(-22, -4, 10, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(22, -4, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = p.a;
  ctx.fillRect(-4, -84, 8, 30);
  ctx.beginPath(); ctx.arc(0, -88, 11, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawPhoto(p) {
  if (!state.photo) {
    ctx.save();
    rr(700, 120, 460, 480, 30);
    ctx.setLineDash([16, 12]);
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.font = '600 26px "Unbounded", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Загрузи фото', 930, 370);
    ctx.restore();
    return;
  }
  const img = state.photo;
  const maxH = 700, maxW = 620;
  const k = Math.min(maxW / img.width, maxH / img.height);
  const w = img.width * k, h = img.height * k;
  const x = 940 - w / 2, y = H - h;
  // white sticker outline + glow
  ctx.save();
  ctx.shadowColor = p.a;
  ctx.shadowBlur = 50;
  ctx.drawImage(img, x, y, w, h);
  ctx.restore();
  ctx.save();
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 0;
  for (const [dx, dy] of [[-5,0],[5,0],[0,-5],[0,5],[-4,-4],[4,4],[-4,4],[4,-4]]) {
    ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy;
    ctx.drawImage(img, x, y, w, h);
  }
  ctx.restore();
  ctx.drawImage(img, x, y, w, h);
}

/* ---------- text ---------- */
function parseLine(line) {
  // returns [{t, hi}]
  const parts = [];
  line.split(/(\*[^*]+\*)/).forEach(seg => {
    if (!seg) return;
    if (seg.startsWith('*') && seg.endsWith('*')) parts.push({ t: seg.slice(1, -1), hi: true });
    else parts.push({ t: seg, hi: false });
  });
  return parts;
}

function drawTitle(p) {
  const lines = state.title.split('\n').map(s => s.trim()).filter(Boolean).slice(0, 4);
  if (!lines.length) return;
  const maxW = 580;
  const maxBlockH = 430;
  let size = 120;
  const font = s => `900 ${s}px "Unbounded", sans-serif`;
  const PAD = 18; // breathing room around a highlighted word
  const lineW = l => parseLine(l).reduce((s, x) => s + ctx.measureText(x.t).width + (x.hi ? PAD * 2 : 0), 0);
  // fit
  for (; size > 40; size -= 2) {
    ctx.font = font(size);
    const widest = Math.max(...lines.map(lineW));
    const blockH = lines.length * size * 1.08;
    if (widest <= maxW && blockH <= maxBlockH) break;
  }
  ctx.font = font(size);
  const lh = size * 1.08;
  const blockH = lines.length * lh;
  let y = 372 - blockH / 2 + size * 0.86;
  const x0 = 64;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.lineJoin = 'round';

  lines.forEach((line, li) => {
    let x = x0;
    parseLine(line).forEach(part => {
      if (part.hi && x > x0) x += PAD;
      else if (part.hi) x += 14;
      const w = ctx.measureText(part.t).width;
      if (part.hi) {
        // highlight box
        ctx.save();
        ctx.translate(x + w / 2, y - size * 0.36);
        ctx.rotate(-0.025);
        rr(-w / 2 - 14, -size * 0.6, w + 28, size * 1.12, 14);
        ctx.fillStyle = p.a;
        ctx.shadowColor = p.a;
        ctx.shadowBlur = 30;
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = '#111';
        ctx.fillText(part.t, x, y);
      } else {
        // depth shadow
        ctx.fillStyle = '#000';
        ctx.fillText(part.t, x + 6, y + 8);
        ctx.lineWidth = size * 0.12;
        ctx.strokeStyle = '#000';
        ctx.strokeText(part.t, x, y);
        ctx.fillStyle = '#fff';
        ctx.fillText(part.t, x, y);
      }
      x += w + (part.hi ? PAD : 0);
    });
    y += lh;
  });
}

function drawSticker(p) {
  if (!state.sticker.trim()) return;
  const t = state.sticker.trim().toUpperCase();
  ctx.save();
  ctx.font = '800 34px "Unbounded", sans-serif';
  const w = ctx.measureText(t).width + 56;
  ctx.translate(64 + w / 2, 640);
  ctx.rotate(-0.04);
  rr(-w / 2, -34, w, 68, 34);
  ctx.fillStyle = '#ff2d55';
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 6;
  ctx.fill();
  ctx.shadowOffsetY = 0;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#fff';
  ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, 0, 2);
  ctx.restore();
}

function drawChannel(p) {
  const t = state.channel.trim();
  if (!t) return;
  ctx.save();
  ctx.font = '800 24px "Unbounded", sans-serif';
  const w = ctx.measureText(t).width;
  const x = 64, y = 52;
  // play icon
  rr(x, y, 52, 38, 10);
  ctx.fillStyle = '#ff0033';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 20, y + 10);
  ctx.lineTo(x + 36, y + 19);
  ctx.lineTo(x + 20, y + 28);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, x + 66, y + 20);
  ctx.fillStyle = p.a;
  ctx.fillRect(x + 66, y + 40, w, 4);
  ctx.restore();
}

/* ---------- render ---------- */
function render() {
  const p = ACCENTS[state.accent];
  document.documentElement.style.setProperty('--accent', p.a);
  ctx.clearRect(0, 0, W, H);
  drawBackground(p);
  ({ code: drawCode, game: drawGame, chat: drawChat, photo: drawPhoto })[state.visual](p);
  drawTitle(p);
  drawSticker(p);
  drawChannel(p);
  mctx.clearRect(0, 0, mini.width, mini.height);
  mctx.drawImage(cv, 0, 0, mini.width, mini.height);
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function syncInputs() {
  $('title').value = state.title;
  $('sticker').value = state.sticker;
  $('channel').value = state.channel;
  document.querySelectorAll('#visual button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === state.visual));
  document.querySelectorAll('#colors .swatch').forEach((b, i) => b.setAttribute('aria-pressed', i === state.accent));
  $('photoWrap').hidden = state.visual !== 'photo';
}

PRESETS.forEach(pr => {
  const b = document.createElement('button');
  b.textContent = pr.name;
  b.onclick = () => {
    Object.assign(state, { title: pr.title, sticker: pr.sticker, visual: pr.visual, accent: pr.accent });
    syncInputs(); render();
  };
  $('presets').appendChild(b);
});
ACCENTS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = `linear-gradient(135deg, ${p.a} 50%, ${p.b} 50%)`;
  b.setAttribute('aria-label', 'Цвет ' + (i + 1));
  b.onclick = () => { state.accent = i; syncInputs(); render(); };
  $('colors').appendChild(b);
});
document.querySelectorAll('#visual button').forEach(b => {
  b.onclick = () => { state.visual = b.dataset.v; syncInputs(); render(); };
});
$('title').oninput = e => { state.title = e.target.value; render(); };
$('sticker').oninput = e => { state.sticker = e.target.value; render(); };
$('channel').oninput = e => { state.channel = e.target.value; render(); };
$('photo').onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => { state.photo = img; render(); };
  img.src = URL.createObjectURL(f);
};
$('dl').onclick = () => {
  const a = document.createElement('a');
  a.download = 'preview-' + (state.channel || 'youtube').toLowerCase() + '.png';
  a.href = cv.toDataURL('image/png');
  a.click();
};

syncInputs();
render();
Promise.all([
  document.fonts.load('900 100px "Unbounded"'),
  document.fonts.load('800 30px "Unbounded"'),
  document.fonts.load('600 24px "Unbounded"'),
  document.fonts.load('700 25px "JetBrains Mono"'),
]).catch(() => {}).finally(() => { render(); window.__ready = true; });
</script>
</body>
</html>
