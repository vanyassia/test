<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заставка канала</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#08080b; --panel:#121217; --line:#25252e; --text:#ececf2; --muted:#8f8f9e; --accent:#e6c27a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font:15px/1.45 "Manrope", system-ui, sans-serif; min-height:100vh; }
  .wrap { max-width:1400px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font:500 20px "Unbounded",sans-serif; letter-spacing:.06em; margin-bottom:4px; }
  .sub { color:var(--muted); margin-bottom:20px; }
  .layout { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:20px; align-items:start; }
  @media (max-width:960px) { .layout { grid-template-columns:1fr; } }
  .stage { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  canvas#c { width:100%; height:auto; display:block; border-radius:8px; aspect-ratio:16/9; background:#000; }
  .bar { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .bar input[type=range] { flex:1; accent-color:var(--accent); }
  .controls { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; display:grid; gap:14px; }
  label { display:grid; gap:6px; font-size:13px; color:var(--muted); }
  input[type=text] { width:100%; background:#0b0b0f; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; font-size:14px; }
  .btn { background:#0b0b0f; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#111; border:none; font-weight:700; padding:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .swatch { width:32px; height:32px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .swatch[aria-pressed=true] { border-color:#fff; }
  .hint { font-size:12px; color:var(--muted); }
  .chk { display:flex; gap:8px; align-items:center; color:var(--text); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Заставка канала</h1>
  <p class="sub">10 секунд, 1920×1080. Меняй текст и цвет, потом записывай видео.</p>
  <div class="layout">
    <div class="stage">
      <canvas id="c" width="1920" height="1080"></canvas>
      <div class="bar">
        <button class="btn" id="play">▶ Играть</button>
        <input type="range" id="seek" min="0" max="10" step="0.01" value="5.2" aria-label="Время">
        <span class="hint" id="time">5.20 с</span>
      </div>
    </div>
    <div class="controls">
      <label>Название канала <input type="text" id="name" value="VANYASSIA" maxlength="16"></label>
      <label>Подпись (три слова через «·» станут карточками) <input type="text" id="tag" value="САЙТЫ · ИГРЫ · ИИ" maxlength="40"></label>
      <div>
        <div class="hint" style="margin-bottom:6px">Металл</div>
        <div class="row" id="colors"></div>
      </div>
      <label class="chk"><input type="checkbox" id="sound" checked> Звук (файл intro/intro-sound.wav)</label>
      <button class="btn primary" id="rec">Записать видео (.webm)</button>
      <p class="hint" id="recHint">Запись идёт 10 секунд в реальном времени. Готовое MP4 со звуком лежит в папке intro/.</p>
    </div>
  </div>
</div>
<audio id="snd" src="intro/intro-sound.wav" preload="auto"></audio>

<script>
const W = 1920, H = 1080, DUR = 10.0;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
function layer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c.getContext('2d'); }
const LCK = layer();   // logo lock-up
const CRD = layer();   // cards

const PALETTES = [
  { name: 'Золото',         metal: ['#fff3d1', '#e9c77f', '#b8872f', '#f6dc9c'], acc: '#e6c27a', amb: ['#3a280c', '#1d1240'] },
  { name: 'Платина',        metal: ['#ffffff', '#d5dbe7', '#8f99ad', '#eef2f9'], acc: '#d0d8e6', amb: ['#0f1d40', '#1c1a2c'] },
  { name: 'Розовое золото', metal: ['#ffe6dc', '#ecae98', '#b46a55', '#f7cbbb'], acc: '#eab09c', amb: ['#3a1422', '#1b1030'] },
  { name: 'Изумруд',        metal: ['#dcffee', '#79dcac', '#2e8c64', '#b2f3d3'], acc: '#7ad8aa', amb: ['#0b2e24', '#0e1830'] },
];
const S = { name: 'VANYASSIA', tag: 'САЙТЫ · ИГРЫ · ИИ', pal: 0 };

/* ---------- timeline (seconds) ---------- */
const T = {
  line: [0.35, 1.35], lineOut: [1.45, 2.1],
  border: [1.25, 2.2], strokes: [1.85, 2.0, 2.15], fill: [2.5, 3.0], impact: 2.75,
  sheen1: [2.95, 3.6], move: [3.2, 4.0],
  letters: 3.45, hair: [4.35, 5.1], tag: [4.55, 5.3], tagOut: [5.35, 5.7],
  up: [5.4, 6.0], cardIn: 5.75, cardSheen: [6.95, 7.6], cardOut: 7.5, down: [7.7, 8.3],
  pill: [8.3, 8.85], cursor: [8.5, 8.95], click: 9.0, cursorOut: [9.25, 9.45],
  sheen2: [9.1, 9.65], out: [9.5, 9.9], close: [9.55, 9.98], black: [9.88, 10.0],
};

/* ---------- math ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutCubic = k => 1 - Math.pow(1 - k, 3);
const easeOutQuint = k => 1 - Math.pow(1 - k, 5);
const easeInCubic = k => k * k * k;
const easeInOut = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const bump = (t, c, w) => Math.exp(-Math.pow((t - c) / w, 2));
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function metal(c, x0, y0, x1, y1, p) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, p.metal[0]); g.addColorStop(0.38, p.metal[1]);
  g.addColorStop(0.62, p.metal[2]); g.addColorStop(1, p.metal[3]);
  return g;
}
function chrome(c, y0, y1) {
  const g = c.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#ffffff'); g.addColorStop(0.47, '#ececf2');
  g.addColorStop(0.53, '#a9a9b8'); g.addColorStop(1, '#f4f4f8');
  return g;
}

/* ---------- static: particles + film grain ---------- */
const R = rng(11);
const DUST = Array.from({ length: 90 }, () => ({ x: R(), y: R(), z: R(), ph: R() * 6.28 }));
const GRAIN = Array.from({ length: 6 }, (_, k) => {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d'); const img = g.createImageData(256, 256); const r = rng(100 + k);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
});

/* ---------- layout of the final lock-up ---------- */
function layout() {
  const name = [...(S.name.trim().toUpperCase() || ' ')];
  let fs = 108; const tile = 150, gap = 58;
  const measure = f => { ctx.font = `500 ${f}px "Unbounded"`; const ws = name.map(ch => ctx.measureText(ch).width); return { ws, textW: ws.reduce((a, b) => a + b, 0) + 0.14 * f * (name.length - 1) }; };
  let m = measure(fs);
  const maxText = W - 320 - tile - gap;
  if (m.textW > maxText) { fs = Math.floor(fs * maxText / m.textW); m = measure(fs); }
  const group = tile + gap + m.textW, x0 = (W - group) / 2;
  return { fs, name, ws: m.ws, textW: m.textW, tile, group, x0, badgeX: x0 + tile / 2, textX: x0 + tile + gap, cy: 500 };
}

/* ---------- background ---------- */
function background(p, t) {
  ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
  const k = easeOutCubic(prog(t, 0.2, 2.8));
  const blob = (x, y, r, col, a) => {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hexA(col, a)); g.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  };
  blob(W * 0.28 + Math.sin(t * 0.25) * 120, H * 0.32 + Math.cos(t * 0.2) * 60, 950, p.amb[1], 0.75 * k);
  blob(W * 0.74 + Math.cos(t * 0.22) * 140, H * 0.66 + Math.sin(t * 0.3) * 50, 850, p.amb[0], 0.7 * k);
  blob(W / 2, 520, 620, p.acc, (0.06 + 0.14 * bump(t, T.impact, 0.35)) * k);
}

function dust(p, t) {
  const k = prog(t, 0.1, 1.6);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const d of DUST) {
    const x = d.x * W + Math.sin(t * 0.3 + d.ph) * 24;
    const y = (((d.y - t * 0.01 * (0.6 + d.z)) % 1) + 1) % 1 * H;
    const r = 1.2 + d.z * d.z * 9;
    const a = (0.05 + 0.22 * d.z) * (0.6 + 0.4 * Math.sin(t * 1.4 + d.ph * 3)) * k;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, hexA(p.metal[0], a)); g.addColorStop(1, hexA(p.metal[0], 0));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  ctx.restore();
}

function lightLine(p, y, w, a) {
  if (w <= 1 || a <= 0) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  let g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0);
  g.addColorStop(0, hexA(p.acc, 0)); g.addColorStop(0.5, hexA(p.acc, 0.9 * a)); g.addColorStop(1, hexA(p.acc, 0));
  ctx.filter = 'blur(12px)'; ctx.fillStyle = g; ctx.fillRect(W / 2 - w / 2, y - 9, w, 18);
  ctx.filter = 'none';
  g = ctx.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(W / 2 - w / 2, y - 1.5, w, 3);
  const f = ctx.createRadialGradient(W / 2, y, 0, W / 2, y, 240);
  f.addColorStop(0, `rgba(255,255,255,${0.45 * a})`); f.addColorStop(0.3, hexA(p.acc, 0.18 * a)); f.addColorStop(1, hexA(p.acc, 0));
  ctx.fillStyle = f; ctx.fillRect(W / 2 - 240, y - 240, 480, 480);
  ctx.restore();
}

/* ---------- logo mark: geometric </> in a rounded tile ---------- */
function halfTile(c, h, r) {
  c.beginPath();
  c.moveTo(0, -h); c.lineTo(h - r, -h);
  c.arc(h - r, -h + r, r, -Math.PI / 2, 0);
  c.lineTo(h, h - r);
  c.arc(h - r, h - r, r, 0, Math.PI / 2);
  c.lineTo(0, h);
}
const GLYPH = [
  [[-0.115, -0.155], [-0.27, 0], [-0.115, 0.155]],
  [[0.052, -0.2], [-0.052, 0.2]],
  [[0.115, -0.155], [0.27, 0], [0.115, 0.155]],
];
function drawMark(c, p, t, x, y, s) {
  const h = s / 2, r = s * 0.27;
  const pulse = bump(t, T.impact, 0.25);
  c.save(); c.translate(x, y);
  // glass body
  const fa = easeOutCubic(prog(t, T.fill[0], T.fill[1]));
  if (fa > 0) {
    c.globalAlpha = fa;
    rr(c, -h, -h, s, s, r);
    const fg = c.createLinearGradient(0, -h, 0, h);
    fg.addColorStop(0, '#26252e'); fg.addColorStop(1, '#0b0b10');
    c.fillStyle = fg; c.fill();
    c.save(); c.clip();
    const hg = c.createLinearGradient(0, -h, 0, 0);
    hg.addColorStop(0, 'rgba(255,255,255,0.12)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = hg; c.fillRect(-h, -h, s, h);
    c.restore();
    c.globalAlpha = 1;
  }
  // border, drawn symmetrically from the top centre
  const kb = easeInOut(prog(t, T.border[0], T.border[1]));
  if (kb > 0) {
    const half = (h - r) + (Math.PI / 2) * r + (2 * h - 2 * r) + (Math.PI / 2) * r + (h - r);
    c.lineWidth = Math.max(2, s * 0.016);
    c.strokeStyle = metal(c, -h, -h, h, h, p);
    for (const sx of [1, -1]) {
      c.save(); c.scale(sx, 1);
      halfTile(c, h, r);
      c.setLineDash([half * kb, half + 2]);
      c.stroke();
      c.restore();
    }
    c.setLineDash([]);
  }
  // glyph
  c.lineWidth = s * 0.068; c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = metal(c, -s * 0.3, -s * 0.22, s * 0.3, s * 0.22, p);
  c.shadowColor = hexA(p.acc, 0.6); c.shadowBlur = s * (0.05 + 0.15 * pulse);
  GLYPH.forEach((pts, i) => {
    const k = easeInOut(prog(t, T.strokes[i], T.strokes[i] + 0.6));
    if (k <= 0) return;
    let len = 0;
    for (let j = 1; j < pts.length; j++) len += Math.hypot(pts[j][0] - pts[j - 1][0], pts[j][1] - pts[j - 1][1]) * s;
    c.beginPath();
    c.moveTo(pts[0][0] * s, pts[0][1] * s);
    for (let j = 1; j < pts.length; j++) c.lineTo(pts[j][0] * s, pts[j][1] * s);
    c.setLineDash([len * k, len + 2]);
    c.stroke();
  });
  c.setLineDash([]);
  c.restore();
}

/* ---------- name, hairline, tagline ---------- */
function drawName(c, p, t, Lo) {
  c.save();
  c.font = `500 ${Lo.fs}px "Unbounded"`;
  c.textBaseline = 'middle'; c.textAlign = 'left';
  const track = lerp(0.42, 0.14, easeOutQuint(prog(t, T.letters - 0.05, T.letters + 1.7))) * Lo.fs;
  const grad = chrome(c, Lo.cy - Lo.fs * 0.42, Lo.cy + Lo.fs * 0.42);
  let x = Lo.textX;
  Lo.name.forEach((ch, i) => {
    const s0 = T.letters + i * 0.075;
    const k = prog(t, s0, s0 + 0.8);
    if (k > 0) {
      const e = easeOutCubic(k);
      c.globalAlpha = e;
      c.filter = e < 0.995 ? `blur(${(1 - e) * 12}px)` : 'none';
      c.fillStyle = grad;
      c.fillText(ch, x, Lo.cy + (1 - e) * 34);
    }
    x += Lo.ws[i] + track;
  });
  c.restore();
}

function drawHairline(c, p, t, Lo) {
  const k = easeInOut(prog(t, T.hair[0], T.hair[1]));
  if (k <= 0) return;
  const w = (Lo.group + 120) * k, y = Lo.cy + 118;
  c.save();
  const g = c.createLinearGradient(W / 2 - w / 2, 0, W / 2 + w / 2, 0);
  g.addColorStop(0, hexA(p.acc, 0)); g.addColorStop(0.5, hexA(p.acc, 0.95)); g.addColorStop(1, hexA(p.acc, 0));
  c.fillStyle = g; c.fillRect(W / 2 - w / 2, y - 1, w, 2);
  // small diamond in the middle
  c.translate(W / 2, y); c.rotate(Math.PI / 4); c.scale(k, k);
  c.fillStyle = metal(c, -6, -6, 6, 6, p); c.fillRect(-6, -6, 12, 12);
  c.restore();
}

function drawTagline(c, p, t, Lo) {
  const text = S.tag.trim().toUpperCase();
  const a = easeOutCubic(prog(t, T.tag[0], T.tag[1])) * (1 - prog(t, T.tagOut[0], T.tagOut[1]));
  if (!text || a <= 0) return;
  const sp = lerp(30, 16, easeOutQuint(prog(t, T.tag[0], T.tag[0] + 1.1)));
  c.save();
  c.font = '600 30px "Manrope"'; c.letterSpacing = sp + 'px';
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.globalAlpha = a; c.fillStyle = p.metal[1];
  c.fillText(text, W / 2 + sp / 2, Lo.cy + 172);
  c.restore();
}

/* ---------- subscribe pill ---------- */
function bellLine(c, x, y, rot, col) {
  c.save(); c.translate(x, y); c.rotate(rot);
  c.strokeStyle = col; c.lineWidth = 2.6; c.lineCap = 'round'; c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(-13, 9); c.quadraticCurveTo(-10, 5, -10, -2); c.arc(0, -2, 10, Math.PI, 0); c.quadraticCurveTo(10, 5, 13, 9); c.closePath();
  c.stroke();
  c.beginPath(); c.moveTo(-4, 14); c.quadraticCurveTo(0, 18, 4, 14); c.stroke();
  c.beginPath(); c.moveTo(0, -12); c.lineTo(0, -15); c.stroke();
  c.restore();
}
function drawPill(c, p, t, Lo) {
  const kin = easeOutCubic(prog(t, T.pill[0], T.pill[1]));
  if (kin <= 0) return;
  const fillK = easeOutCubic(prog(t, T.click, T.click + 0.35));
  const done = fillK > 0.4;
  const label = done ? 'ВЫ ПОДПИСАНЫ' : 'ПОДПИСАТЬСЯ';
  c.save();
  c.font = '700 28px "Manrope"'; c.letterSpacing = '7px';
  const bw = c.measureText(label).width + 128, bh = 82;
  const press = 1 - 0.05 * Math.sin(Math.PI * prog(t, T.click - 0.05, T.click + 0.15));
  c.globalAlpha = kin;
  c.filter = kin < 0.995 ? `blur(${(1 - kin) * 10}px)` : 'none';
  c.translate(W / 2, Lo.cy + 186 + (1 - kin) * 24); c.scale(press, press);
  rr(c, -bw / 2, -bh / 2, bw, bh, bh / 2);
  c.fillStyle = 'rgba(255,255,255,0.045)'; c.fill();
  if (fillK > 0) { c.save(); c.globalAlpha = kin * fillK; c.fillStyle = metal(c, -bw / 2, -bh / 2, bw / 2, bh / 2, p); c.fill(); c.restore(); }
  c.lineWidth = 2; c.strokeStyle = metal(c, -bw / 2, -bh / 2, bw / 2, bh / 2, p); c.stroke();
  const ix = -bw / 2 + 46;
  const ring = t > T.click ? Math.sin((t - T.click) * 22) * 0.45 * Math.exp(-(t - T.click) * 3) : 0;
  bellLine(c, ix, 0, ring, done ? '#141418' : p.metal[1]);
  c.fillStyle = done ? '#141418' : 'rgba(245,245,250,0.95)';
  c.textAlign = 'left'; c.textBaseline = 'middle';
  c.fillText(label, ix + 32, 2);
  c.restore();
}

function drawCursor(t, Lo) {
  const mk = easeInOut(prog(t, T.cursor[0], T.cursor[1]));
  const out = prog(t, T.cursorOut[0], T.cursorOut[1]);
  if (mk <= 0 || out >= 1) return;
  const tx = W / 2 + 80, ty = Lo.cy + 196;
  const x = lerp(W * 0.8, tx, mk), y = lerp(H * 0.97, ty, mk) - Math.sin(mk * Math.PI) * 50;
  const cs = 1 - 0.14 * Math.sin(Math.PI * prog(t, T.click - 0.05, T.click + 0.15));
  ctx.save();
  ctx.globalAlpha = 1 - out;
  ctx.translate(x, y); ctx.scale(1.35 * cs, 1.35 * cs);
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(8.5, 26.5); ctx.lineTo(14.5, 40); ctx.lineTo(20, 37.5);
  ctx.lineTo(14, 24.5); ctx.lineTo(25, 24.5); ctx.closePath();
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.lineWidth = 1.6; ctx.strokeStyle = '#111'; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

/* ---------- cards ---------- */
function cardLabels() {
  const parts = S.tag.split(/[·•|,]/).map(s => s.trim().toUpperCase()).filter(Boolean);
  const def = ['САЙТЫ', 'ИГРЫ', 'ИИ'];
  return [0, 1, 2].map(i => parts[i] || def[i]);
}
function strokeOn(c, build, L, k) {
  if (k <= 0) return;
  c.beginPath(); build(); c.setLineDash([L * k, L + 2]); c.stroke(); c.setLineDash([]);
}
const ICONS = [
  (c, k) => { // browser window with </>
    strokeOn(c, () => rr(c, -72, -52, 144, 104, 16), 2 * (144 + 104) - (8 - 2 * Math.PI) * 16, k);
    strokeOn(c, () => { c.moveTo(-72, -24); c.lineTo(72, -24); }, 144, prog(k, 0.3, 0.7));
    c.save(); c.globalAlpha *= prog(k, 0.5, 0.8);
    [-52, -38, -24].forEach(x => { c.beginPath(); c.arc(x, -38, 4, 0, Math.PI * 2); c.fill(); });
    c.restore();
    const g = prog(k, 0.45, 1);
    strokeOn(c, () => { c.moveTo(-14, 2); c.lineTo(-30, 16); c.lineTo(-14, 30); }, 46, g);
    strokeOn(c, () => { c.moveTo(14, 2); c.lineTo(30, 16); c.lineTo(14, 30); }, 46, g);
    strokeOn(c, () => { c.moveTo(5, -1); c.lineTo(-5, 33); }, 36, prog(g, 0.2, 1));
  },
  (c, k) => { // gamepad
    strokeOn(c, () => rr(c, -82, -46, 164, 92, 46), 2 * (164 + 92) - (8 - 2 * Math.PI) * 46, k);
    const g = prog(k, 0.4, 1);
    strokeOn(c, () => { c.moveTo(-58, 0); c.lineTo(-26, 0); }, 32, g);
    strokeOn(c, () => { c.moveTo(-42, -16); c.lineTo(-42, 16); }, 32, g);
    strokeOn(c, () => c.arc(36, -12, 8, -Math.PI / 2, Math.PI * 1.5), 51, prog(g, 0.2, 1));
    strokeOn(c, () => c.arc(54, 10, 8, -Math.PI / 2, Math.PI * 1.5), 51, prog(g, 0.35, 1));
  },
  (c, k) => { // AI sparkle
    const star = (x, y, r) => () => {
      c.moveTo(x, y - r);
      c.quadraticCurveTo(x, y, x + r, y); c.quadraticCurveTo(x, y, x, y + r);
      c.quadraticCurveTo(x, y, x - r, y); c.quadraticCurveTo(x, y, x, y - r);
    };
    strokeOn(c, star(-14, 6, 54), 4.6 * 54, k);
    strokeOn(c, star(48, -38, 20), 4.6 * 20, prog(k, 0.35, 1));
    strokeOn(c, () => c.arc(46, 36, 5, -Math.PI / 2, Math.PI * 1.5), 32, prog(k, 0.6, 1));
  },
];
function drawCards(c, p, t) {
  const labels = cardLabels();
  for (let i = 0; i < 3; i++) {
    const s0 = T.cardIn + i * 0.2;
    const kin = prog(t, s0, s0 + 0.9);
    if (kin <= 0) continue;
    const kout = easeInCubic(prog(t, T.cardOut + i * 0.07, T.cardOut + 0.45 + i * 0.07));
    if (kout >= 1) continue;
    const e = easeOutCubic(kin), a = e * (1 - kout);
    const cx = W / 2 + (i - 1) * 470;
    const cy = 660 + (1 - e) * 70 + kout * 50 + Math.sin(t * 1.3 + i * 1.7) * 4;
    const w = 410, h = 280, r = 30;
    c.save();
    c.globalAlpha = a;
    const bl = (1 - e) * 14 + kout * 14;
    c.filter = bl > 0.3 ? `blur(${bl}px)` : 'none';
    c.translate(cx, cy);
    rr(c, -w / 2, -h / 2, w, h, r);
    const gg = c.createLinearGradient(0, -h / 2, 0, h / 2);
    gg.addColorStop(0, 'rgba(255,255,255,0.08)'); gg.addColorStop(1, 'rgba(255,255,255,0.015)');
    c.fillStyle = gg; c.fill();
    c.globalAlpha = a * 0.6; c.lineWidth = 1.5; c.strokeStyle = metal(c, -w / 2, -h / 2, w / 2, h / 2, p); c.stroke();
    c.globalAlpha = a;
    // icon
    c.save(); c.translate(0, -28);
    c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = c.fillStyle = metal(c, -80, -50, 80, 50, p);
    c.shadowColor = hexA(p.acc, 0.5); c.shadowBlur = 12;
    ICONS[i](c, easeInOut(prog(t, s0 + 0.2, s0 + 1.15)));
    c.restore();
    c.font = '700 28px "Manrope"'; c.letterSpacing = '9px';
    c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillStyle = 'rgba(240,240,248,0.92)';
    c.fillText(labels[i], 4.5, 84);
    c.restore();
  }
}

/* ---------- composition helpers ---------- */
function sheen(c, x0, x1, k) {
  if (k <= 0 || k >= 1) return;
  const sx = lerp(x0, x1, easeInOut(k));
  c.save();
  c.globalCompositeOperation = 'source-atop';
  c.translate(sx, H / 2); c.rotate(0.35);
  const g = c.createLinearGradient(-110, 0, 110, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.5, 'rgba(255,255,255,0.7)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(-110, -H, 220, H * 2);
  c.restore();
}
function composite(c, alpha, glow, blur) {
  if (alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  if (blur > 0.3) ctx.filter = `blur(${blur}px)`;
  ctx.drawImage(c.canvas, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = alpha * glow;
  ctx.filter = `blur(${22 + blur}px)`;
  ctx.drawImage(c.canvas, 0, 0);
  ctx.restore();
}
function finish(t) {
  const v = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.95);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.09;
  const f = Math.floor(t * 24);
  const pat = ctx.createPattern(GRAIN[f % GRAIN.length], 'repeat');
  const r = rng(f + 3);
  ctx.translate(-r() * 256, -r() * 256);
  ctx.fillStyle = pat; ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}

/* ---------- frame ---------- */
function renderAt(t) {
  const p = PALETTES[S.pal];
  const Lo = layout();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.filter = 'none';
  background(p, t);
  dust(p, t);

  // opening light line
  lightLine(p, 520, 1300 * easeOutCubic(prog(t, T.line[0], T.line[1])), 1 - prog(t, T.lineOut[0], T.lineOut[1]));

  // ----- lock-up layer -----
  const c = LCK;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H);
  const lk = easeInOut(prog(t, T.up[0], T.up[1])) - easeInOut(prog(t, T.down[0], T.down[1]));
  c.save();
  if (lk > 0) { const s = lerp(1, 0.6, lk); c.translate(W / 2, lerp(Lo.cy, 180, lk)); c.scale(s, s); c.translate(-W / 2, -Lo.cy); }
  const mk = easeInOut(prog(t, T.move[0], T.move[1]));
  drawMark(c, p, t, lerp(W / 2, Lo.badgeX, mk), lerp(520, Lo.cy, mk), Lo.tile * lerp(1.3, 1, mk));
  drawName(c, p, t, Lo);
  drawHairline(c, p, t, Lo);
  drawTagline(c, p, t, Lo);
  c.restore();
  drawPill(c, p, t, Lo);
  sheen(c, W / 2 - 260, W / 2 + 260, prog(t, T.sheen1[0], T.sheen1[1]));
  sheen(c, Lo.x0 - 260, Lo.x0 + Lo.group + 260, prog(t, T.sheen2[0], T.sheen2[1]));
  const out = easeInCubic(prog(t, T.out[0], T.out[1]));
  composite(c, 1 - out, 0.3 + 0.6 * bump(t, T.impact, 0.3), out * 16);

  // ----- cards layer -----
  if (t > T.cardIn && t < T.cardOut + 0.8) {
    const d = CRD;
    d.setTransform(1, 0, 0, 1, 0, 0); d.clearRect(0, 0, W, H);
    drawCards(d, p, t);
    sheen(d, W / 2 - 900, W / 2 + 900, prog(t, T.cardSheen[0], T.cardSheen[1]));
    composite(d, 1, 0.18, 0);
  }

  drawCursor(t, Lo);

  // closing light line
  const ck = Math.sin(Math.PI * prog(t, T.close[0], T.close[1]));
  lightLine(p, Lo.cy, 1500 * ck, ck);

  finish(t);
  const blk = Math.max(1 - prog(t, 0, 0.35), prog(t, T.black[0], T.black[1]));
  if (blk > 0) { ctx.fillStyle = `rgba(0,0,0,${blk})`; ctx.fillRect(0, 0, W, H); }
}
window.renderAt = renderAt;
window.INTRO_DURATION = DUR;

/* ---------- player UI ---------- */
const $ = id => document.getElementById(id);
const snd = $('snd');
let playing = false, t0 = 0, cur = 5.2, onEnd = null;
function show(t) {
  cur = t; renderAt(t);
  $('seek').value = t.toFixed(2);
  $('time').textContent = t.toFixed(2) + ' с';
}
function loop(now) {
  if (!playing) return;
  const t = (now - t0) / 1000;
  if (t >= DUR) { playing = false; show(DUR); $('play').textContent = '▶ Играть'; if (onEnd) onEnd(); return; }
  show(t);
  requestAnimationFrame(loop);
}
function play() {
  playing = true; $('play').textContent = '■ Стоп';
  t0 = performance.now();
  if ($('sound').checked && snd.readyState >= 2) { snd.currentTime = 0; snd.play().catch(() => {}); }
  requestAnimationFrame(loop);
}
function stop() { playing = false; snd.pause(); $('play').textContent = '▶ Играть'; }
$('play').onclick = () => playing ? stop() : play();
$('seek').oninput = e => { stop(); show(+e.target.value); };
$('name').oninput = e => { S.name = e.target.value; if (!playing) show(cur); };
$('tag').oninput = e => { S.tag = e.target.value; if (!playing) show(cur); };
PALETTES.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.title = p.name;
  b.style.background = `linear-gradient(135deg, ${p.metal[0]}, ${p.metal[1]} 45%, ${p.metal[2]})`;
  b.setAttribute('aria-label', p.name);
  b.setAttribute('aria-pressed', i === S.pal);
  b.onclick = () => {
    S.pal = i;
    document.querySelectorAll('.swatch').forEach((s, j) => s.setAttribute('aria-pressed', j === i));
    document.documentElement.style.setProperty('--accent', p.acc);
    if (!playing) show(cur);
  };
  $('colors').appendChild(b);
});

let actx = null, dest = null;
$('rec').onclick = () => {
  if (!window.MediaRecorder) { $('recHint').textContent = 'Браузер не умеет записывать видео. Попробуй Chrome.'; return; }
  const stream = cv.captureStream(60);
  if ($('sound').checked && snd.readyState >= 2) {
    try {
      if (!actx) {
        actx = new AudioContext();
        const src = actx.createMediaElementSource(snd);
        dest = actx.createMediaStreamDestination();
        src.connect(dest); src.connect(actx.destination);
      }
      dest.stream.getAudioTracks().forEach(tr => stream.addTrack(tr));
    } catch (e) {}
  }
  const type = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm';
  const rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 });
  const chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
    a.download = 'intro-' + (S.name.trim().toLowerCase() || 'channel') + '.webm';
    a.click();
    $('rec').disabled = false; $('rec').textContent = 'Записать видео (.webm)';
  };
  $('rec').disabled = true; $('rec').textContent = 'Записываю…';
  onEnd = () => { onEnd = null; setTimeout(() => rec.stop(), 150); };
  rec.start();
  play();
};

show(cur);
Promise.all([
  document.fonts.load('500 108px "Unbounded"'),
  document.fonts.load('600 30px "Manrope"'),
  document.fonts.load('700 28px "Manrope"'),
]).catch(() => {}).finally(() => { show(cur); window.__ready = true; });
</script>
</body>
</html>
